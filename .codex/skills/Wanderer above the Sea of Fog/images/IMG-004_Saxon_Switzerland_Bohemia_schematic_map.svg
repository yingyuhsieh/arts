  <text x="90" y="90" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#21343d">Saxon Switzerland &amp; Bohemia</text>
  <text x="90" y="145" font-family="Arial, sans-serif" font-size="28" fill="#4b5d65">Schematic reference — proposed source motifs, not a reconstruction of one viewpoint</text>
