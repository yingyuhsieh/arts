  <text x="90" y="600" font-family="Arial, sans-serif" font-size="27" fill="#805544">Approximate Saxony–Bohemia transition</text>
  <text x="90" y="790" font-family="Arial, sans-serif" font-size="29" fill="#27363d">Friedrich combined motifs recorded at different places and times.</text>
  <text x="90" y="835" font-family="Arial, sans-serif" font-size="26" fill="#5d6c72">Place identifications remain scholarly proposals; the painting is not a literal panorama.</text>
